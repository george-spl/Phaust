# Phaust configuration — edit paths and model for your LM Studio setup.

[phaust]
name = "Phaust-2"
iteration = 2

[llm]
# Load Qwen3-14B Q4_K_M in LM Studio; model id must match Developer tab / GET /v1/models
# LM Studio context length: 32768 recommended (see docs/STRESS_TESTS.md)
model = "qwen/qwen3-14b"
base_url = "http://127.0.0.1:1234/v1"
api_key = "NO_API_KEY"
# Tool/chat turns: lower temp = steadier tool calls; cap output for 32k context headroom
temperature = 0.25
max_tokens = 2048

# Explain-mode synthesis (read_file → grounded answer). Same model; tighter sampling.
[llm.synthesis]
model = "qwen/qwen3-14b"
temperature = 0.15
max_tokens = 2048

[workspace]
# Relative to this file's directory (project root)
root = "."

[memory]
# LM Studio: load an embedding model (not the chat model) for semantic search quality
embedding_model = "text-embedding-nomic-embed-text-v1.5"
max_messages = 50
compact_batch = 10
max_episodes = 500
semantic_top_k = 5
hybrid_retrieval = true
filename_boost = 0.4
lexical_weight = 0.25
query_expansion = true

[agent]
agents_md = "AGENTS.md"
max_tool_rounds = 12
max_write_proposals = 2
require_write_approval = true
# Natural chat: answer from injected memory first; warmer sampling; quieter memory tool traces
conversational_first = true
chat_temperature = 0.35
quiet_memory_tools = true

[tasks]
enabled = true
storage_dir = "Memory/tasks"
auto_checkpoint = true

[shell]
enabled = true
require_approval = true
timeout_seconds = 120
max_output_bytes = 65536
allow = [
  "python --version",
  "python -m pip list",
  "python -m pip show",
  "python -m py_compile",
  "git status",
  "git diff",
  "git branch",
  "git log",
]
