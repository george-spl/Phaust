# Phaust configuration — edit paths and model for your LM Studio setup.

[phaust]
name = "Phaust-2"
iteration = 2

[llm]
model = "qwen/qwen3.5-9b"
base_url = "http://127.0.0.1:1234/v1"
api_key = "NO_API_KEY"
temperature = 0.3
max_tokens = 2048

# Optional: different model for explain-mode synthesis (read_file → answer).
# Omit [llm.synthesis] to use the main model above.
# [llm.synthesis]
# model = "qwen/qwen3.5-9b"
# temperature = 0.2
# max_tokens = 1024

[workspace]
# Relative to this file's directory (project root)
root = "."

[memory]
# Separate from [llm].model — load this embedding model in LM Studio (see README.md)
embedding_model = "text-embedding-nomic-embed-text-v1.5"
max_messages = 50
compact_batch = 10
max_episodes = 500
semantic_top_k = 5
hybrid_retrieval = true
filename_boost = 0.4
lexical_weight = 0.25
query_expansion = true

[agent]
agents_md = "AGENTS.md"
max_tool_rounds = 12
max_write_proposals = 2
require_write_approval = true

[tasks]
enabled = true
storage_dir = "Memory/tasks"
auto_checkpoint = true

[shell]
enabled = true
require_approval = true
timeout_seconds = 120
max_output_bytes = 65536
allow = [
  "python --version",
  "python -m pytest",
  "python -m pip list",
  "python -m pip show",
  "python -m py_compile",
  "git status",
  "git diff",
  "git branch",
  "git log",
]
